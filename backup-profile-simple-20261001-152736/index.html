<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profil Saya | Memora</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../../css/customer-account.css"
  >

</head>

<body>


  <header class="site-header">

    <div class="header-inner">

      <a href="/" class="brand">
        MEMORA
      </a>

      <nav
        class="customer-nav"
        id="customerNav"
      ></nav>

    </div>

  </header>


  <main class="account-shell">

    <div class="account-breadcrumb">

      <a href="/account/">
        Akun Saya
      </a>

      <span>›</span>

      <strong>
        Profil Saya
      </strong>

    </div>


    <span class="account-eyebrow">
      PROFIL
    </span>

    <h1 class="account-title">
      Profil Saya
    </h1>

    <p class="account-description">
      Kelola informasi akun yang digunakan
      untuk membantu proses pesanan Memora.
    </p>


    <section class="account-content-card">

      <h2 class="account-section-title">
        Informasi Profil
      </h2>

      <p class="account-section-description">
        Pastikan informasi berikut tetap sesuai
        agar Memora dapat menghubungimu dengan mudah.
      </p>


      <form
        class="account-form"
        id="customerProfileForm"
      >

        <div class="account-form-grid">


          <div class="account-field full">

            <label for="profileFullName">
              Nama Lengkap
            </label>

            <input
              type="text"
              id="profileFullName"
              required
            >

          </div>


          <div class="account-field">

            <label for="profileEmail">
              Email
            </label>

            <input
              type="email"
              id="profileEmail"
              readonly
            >

          </div>


          <div class="account-field">

            <label for="profileWhatsapp">
              WhatsApp
            </label>

            <input
              type="text"
              id="profileWhatsapp"
              placeholder="08xxxxxxxxxx"
            >

          </div>


          <div class="account-field full">

            <label for="profileAddress">
              Alamat Utama
            </label>

            <textarea
              id="profileAddress"
              placeholder="Alamat lengkap"
            ></textarea>

          </div>


          <div class="account-field">

            <label for="profileCity">
              Kota / Kabupaten
            </label>

            <input
              type="text"
              id="profileCity"
            >

          </div>


          <div class="account-field">

            <label for="profilePostalCode">
              Kode Pos
            </label>

            <input
              type="text"
              id="profilePostalCode"
            >

          </div>


        </div>


        <button
          type="submit"
          class="account-primary-button"
          id="saveCustomerProfile"
        >
          Simpan Perubahan
        </button>


        <div
          class="account-message"
          id="profileMessage"
        ></div>


      </form>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="../../js/supabase.js"></script>

  <script src="../../js/customer-auth-guard.js"></script>

  <script src="../../js/customer-nav.js"></script>

  <script src="../../js/customer-profile.js"></script>


</body>
</html>
