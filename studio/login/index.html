<!doctype html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    MEMORA Studio Login
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/css/app.css"
  >

  <link
    rel="stylesheet"
    href="/css/studio.css"
  >

</head>


<body>


  <main class="studio-login-page">

    <section class="studio-login-card">

      <span class="studio-eyebrow">
        MEMORA Studio
      </span>

      <h1>
        Admin Login
      </h1>

      <p>
        Login menggunakan akun owner atau admin MEMORA.
      </p>


      <form id="studioLoginForm">

        <div class="studio-field">

          <label for="studioEmail">
            Email
          </label>

          <input
            type="email"
            id="studioEmail"
            required
            autocomplete="email"
          >

        </div>


        <div class="studio-field">

          <label for="studioPassword">
            Password
          </label>

          <input
            type="password"
            id="studioPassword"
            required
            autocomplete="current-password"
          >

        </div>


        <div
          class="studio-message"
          id="studioLoginMessage"
        ></div>


        <button
          type="submit"
          class="studio-primary-button"
          id="studioLoginButton"
        >
          Login
        </button>

      </form>


      <a
        href="/"
        class="studio-home-link"
      >
        Back to MEMORA
      </a>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="/js/supabase.js"></script>

  <script src="/js/studio-login.js"></script>

</body>

</html>
