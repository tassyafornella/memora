<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>MEMORA Studio Login</title>

  <link
    rel="stylesheet"
    href="/css/admin.css?v=1"
  >
</head>

<body>

  <main class="admin-login-page">

    <section class="admin-login-card">

      <div class="admin-brand">
        MEMORA
      </div>

      <h1>
        Studio Login
      </h1>

      <p>
        Masuk menggunakan akun Administrator MEMORA.
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          class="btn btn-primary btn-block"
          type="submit"
        >
          Login
        </button>

        <div
          id="loginMessage"
          class="message"
          hidden
        ></div>

      </form>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/admin-login.js"></script>

</body>
</html>
