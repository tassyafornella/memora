<!doctype html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Addresses — MEMORA
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/css/app.css"
  >

  <link
    rel="stylesheet"
    href="/css/address.css"
  >

</head>


<body>

  <div class="memora-page-back memora-address-back">
  <a
    href="/account/"
    id="addressBackButton"
    data-memora-back
  >
    Back
  </a>
</div>

<main class="address-page">


    <div class="address-breadcrumb">

      <a href="/">
        Home
      </a>

      <span>/</span>

      <span>
        Addresses
      </span>

    </div>


    <header class="address-heading">

      <div>

        <span class="address-eyebrow">
          Account
        </span>

        <h1>
          Alamat Pengiriman
        </h1>

        <p>
          Simpan maksimal 5 alamat pengiriman.
        </p>

      </div>


      <button
        type="button"
        class="add-address-button"
        id="addAddressButton"
      >
        + Tambah Alamat
      </button>

    </header>


    <div
      class="address-message"
      id="pageAddressMessage"
    ></div>


    <section
      class="address-login-required"
      id="addressLoginRequired"
      hidden
    >

      <h2>
        Login diperlukan.
      </h2>

      <p>
        Silakan login untuk mengelola alamat.
      </p>

      <a
        href="/account/login/?next=/account/addresses/"
      >
        Login
      </a>

    </section>


    <section
      class="address-content"
      id="addressContent"
      hidden
    >

      <div class="address-count">

        <span id="addressCount">
          0 dari 5 alamat
        </span>

      </div>


      <div
        class="address-list"
        id="addressList"
      ></div>


      <div
        class="address-empty"
        id="addressEmpty"
        hidden
      >

        <strong>
          Belum ada alamat.
        </strong>

        <p>
          Tambahkan alamat pertama untuk
          melanjutkan proses checkout.
        </p>

      </div>

    </section>


  </main>


  <!-- ======================================================
       MODAL
  ======================================================= -->

  <div
    class="address-modal"
    id="addressModal"
    hidden
  >

    <div
      class="address-backdrop"
      data-close-address
    ></div>


    <div class="address-dialog">

      <div class="address-dialog-header">

        <div>

          <span class="address-eyebrow">
            Delivery Address
          </span>

          <h2 id="addressModalTitle">
            Tambah Alamat
          </h2>

        </div>


        <button
          type="button"
          class="address-close"
          data-close-address
        >x</button>

      </div>


      <form id="addressForm">

        <input
          type="hidden"
          id="addressId"
        >


        <div class="address-form-grid">


          <div class="address-field">

            <label for="addressLabel">
              Label Alamat *
            </label>

            <select
              id="addressLabel"
              required
            >

              <option value="Rumah">
                Rumah
              </option>

              <option value="Kantor">
                Kantor
              </option>

              <option value="Apartemen">
                Apartemen
              </option>

              <option value="Lainnya">
                Lainnya
              </option>

            </select>

          </div>


          <div class="address-field">

            <label for="addressRecipient">
              Nama Penerima *
            </label>

            <input
              type="text"
              id="addressRecipient"
              required
            >

          </div>


          <div class="address-field">

            <label for="addressPhone">
              Nomor Telepon *
            </label>

            <input
              type="tel"
              id="addressPhone"
              required
            >

          </div>


          <div class="address-field">

            <label for="addressProvince">
              Provinsi *
            </label>

            <input
              type="text"
              id="addressProvince"
              placeholder="Contoh: Jawa Tengah"
              required
            >

          </div>


          <div class="address-field">

            <label for="addressCity">
              Kota / Kabupaten *
            </label>

            <input
              type="text"
              id="addressCity"
              placeholder="Contoh: Pemalang"
              required
            >

          </div>


          <div class="address-field">

            <label for="addressDistrict">
              Kecamatan *
            </label>

            <input
              type="text"
              id="addressDistrict"
              required
            >

          </div>


          <div class="address-field">

            <label for="addressVillage">
              Kelurahan / Desa *
            </label>

            <input
              type="text"
              id="addressVillage"
              required
            >

          </div>


          <div class="address-field">

            <label for="addressPostalCode">
              Kode Pos
            </label>

            <input
              type="text"
              inputmode="numeric"
              id="addressPostalCode"
            >

          </div>


          <div class="address-field full">

            <label for="addressLine">
              Alamat Lengkap *
            </label>

            <textarea
              id="addressLine"
              placeholder="Nama jalan, nomor rumah, RT/RW, blok, kompleks, dll."
              required
            ></textarea>

          </div>


          <div class="address-field full">

            <label for="addressLandmark">
              Patokan
            </label>

            <input
              type="text"
              id="addressLandmark"
              placeholder="Opsional"
            >

          </div>


        </div>


        <label class="primary-checkbox">

          <input
            type="checkbox"
            id="addressPrimary"
          >

          <span>
            Jadikan sebagai alamat utama
          </span>

        </label>


        <div
          class="address-form-message"
          id="addressFormMessage"
        ></div>


        <div class="address-form-actions">

          <button
            type="button"
            class="address-cancel-button"
            data-close-address
          >
            Batal
          </button>

          <button
            type="submit"
            class="address-save-button"
            id="saveAddressButton"
          >
            Simpan Alamat
          </button>

        </div>


      </form>

    </div>

  </div>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="/js/supabase.js"></script>

  <script src="/js/app.js"></script>

  <script src="/js/addresses.js"></script>

  <script src="/js/customer-flow.js"></script>
  <script src="/js/back-navigation.js"></script>
</body>

</html>
