<!doctype html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>My Orders - MEMORA</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/css/app.css"
  >

  <link
    rel="stylesheet"
    href="/css/account.css"
  >

</head>


<body>


  <main class="account-page">

    <div class="account-breadcrumb">

      <a href="/">
        Home
      </a>

      <span>/</span>

      <a href="/account/">
        Account
      </a>

      <span>/</span>

      <span>
        Orders
      </span>

    </div>


    <div class="memora-page-back">
  <a
    href="/account/"
    data-memora-back="/account/"
  >
    Back to Account
  </a>
</div>

<header class="account-heading">

      <div>

        <span class="account-eyebrow">
          Customer Account
        </span>

        <h1>
          My Orders
        </h1>

        <p>
          Riwayat seluruh pesanan MEMORA.
        </p>

      </div>

    </header>


    <section
      class="account-loading"
      id="ordersLoading"
    >
      Memuat pesanan...
    </section>


    <section
      id="ordersContent"
      hidden
    >

      <div
        class="orders-list"
        id="ordersList"
      ></div>


      <div
        class="account-empty"
        id="ordersEmpty"
        hidden
      >

        <strong>
          Belum ada pesanan.
        </strong>

        <p>
          Pesanan yang berhasil dibuat akan muncul di sini.
        </p>

        <a href="/#collection">
          Shop Collection
        </a>

      </div>

    </section>


    <div
      class="account-message"
      id="ordersMessage"
    ></div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="/js/supabase.js"></script>

  <script src="/js/app.js"></script>

  <script src="/js/account-orders.js"></script>


  <script src="/js/customer-flow.js"></script>
  <script src="/js/back-navigation.js"></script>
</body>

</html>
