<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profil Saya | Memora</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../../css/customer-account.css"
  >


<style>
  .account-back-button {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    margin-bottom: 18px;

    color: #173f35;

    font-family: "Poppins", Arial, sans-serif;
    font-size: 12px;
    font-weight: 600;

    text-decoration: none;
  }

  .account-back-button:hover {
    opacity: 0.75;
  }
</style>

</head>

<body>


  <header class="site-header">

    <div class="header-inner">

      <a
        href="/"
        class="brand"
      >
        MEMORA
      </a>

      <nav
        class="customer-nav"
        id="customerNav"
      ></nav>

    </div>

  </header>


  <main class="account-shell">

    <a
      href="/account/"
      class="account-back-button"
    >
      ‹ Kembali
    </a>



    <div class="account-breadcrumb">

      <a href="/account/">
        Akun Saya
      </a>

      <span>›</span>

      <strong>
        Profil Saya
      </strong>

    </div>


    <span class="account-eyebrow">
      PROFIL
    </span>


    <h1 class="account-title">
      Profil Saya
    </h1>


    <p class="account-description">
      Kelola informasi dasar akun Memora-mu.
    </p>


    <section class="account-content-card">

      <h2 class="account-section-title">
        Informasi Akun
      </h2>


      <p class="account-section-description">
        Informasi ini digunakan untuk identitas akun
        dan komunikasi terkait pesanan.
      </p>


      <form
        class="account-form"
        id="customerProfileForm"
      >


        <div class="account-form-grid">


          <div class="account-field full">

            <label for="profileFullName">
              Nama Lengkap
            </label>

            <input
              type="text"
              id="profileFullName"
              autocomplete="name"
              required
            >

          </div>


          <div class="account-field">

            <label for="profileEmail">
              Email
            </label>

            <input
              type="email"
              id="profileEmail"
              autocomplete="email"
              readonly
            >

          </div>


          <div class="account-field">

            <label for="profileWhatsapp">
              WhatsApp / Nomor Telepon
            </label>

            <input
              type="tel"
              id="profileWhatsapp"
              autocomplete="tel"
              placeholder="08xxxxxxxxxx"
            >

          </div>


        </div>


        <button
          type="submit"
          class="account-primary-button"
          id="saveCustomerProfile"
        >
          Simpan Perubahan
        </button>


        <div
          class="account-message"
          id="profileMessage"
        ></div>


      </form>

    </section>


  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="../../js/supabase.js"></script>

  <script src="../../js/customer-auth-guard.js"></script>

  <script src="../../js/customer-nav.js"></script>

  <script src="../../js/customer-profile.js"></script>


</body>
</html>
