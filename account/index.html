<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Akun Saya | Memora</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../css/customer-account.css"
  >

  <link rel="stylesheet" href="/css/customer-nav.css">
  <link rel="stylesheet" href="/css/customer-final.css?v=20261002-185048">
</head>

<body>


  <header class="site-header">

    <div class="header-inner">

      <a
        href="/"
        class="brand"
      >
        MEMORA
      </a>

      <nav
        class="customer-nav"
        id="customerNav"
      ></nav>

    </div>

  </header>


  <main class="account-shell">

    <span class="account-eyebrow">
      AKUN MEMORA
    </span>

    <h1
      class="account-title"
      id="accountHubGreeting"
    >
      Akun Saya
    </h1>

    <p class="account-description">
      Kelola informasi akun, alamat pengiriman,
      dan pesanan Memora-mu dalam satu tempat.
    </p>


    <div class="account-hub-card">


      <a
        href="/account/profile/"
        class="account-hub-item"
      >

        <span class="account-hub-icon">
          P
        </span>

        <span class="account-hub-copy">

          <strong>
            Profil Saya
          </strong>

          <small>
            Kelola nama, kontak, dan informasi akun
          </small>

        </span>

        <span class="account-hub-arrow">
          →
        </span>

      </a>


      <a
        href="/account/addresses/"
        class="account-hub-item"
      >

        <span class="account-hub-icon">
          A
        </span>

        <span class="account-hub-copy">

          <strong>
            Alamat Saya
          </strong>

          <small>
            Kelola alamat untuk pengiriman pesanan
          </small>

        </span>

        <span class="account-hub-arrow">
          →
        </span>

      </a>


      <a
        href="/account/orders/"
        class="account-hub-item"
      >

        <span class="account-hub-icon">
          O
        </span>

        <span class="account-hub-copy">

          <strong>
            Pesanan Saya
          </strong>

          <small>
            Lihat pesanan dan perkembangan prosesnya
          </small>

        </span>

        <span class="account-hub-arrow">
          →
        </span>

      </a>


      <button
        type="button"
        class="account-hub-item logout"
        id="accountHubLogout"
      >

        <span class="account-hub-icon">
          ↗
        </span>

        <span class="account-hub-copy">

          <strong>
            Keluar
          </strong>

          <small>
            Keluar dari akun Memora
          </small>

        </span>

        <span class="account-hub-arrow">
          →
        </span>

      </button>


    </div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="../js/supabase.js"></script>

  <script src="../js/customer-auth-guard.js"></script>

  <script src="../js/customer-nav.js"></script>

  <script src="../js/account-hub.js"></script>


</body>
</html>
