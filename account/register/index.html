<!doctype html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Register - MEMORA
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/css/app.css"
  >

  <link
    rel="stylesheet"
    href="/css/auth.css"
  >

</head>


<body>


  <main class="auth-page">

    <section class="auth-layout">


      <div class="auth-visual">

        <a
          href="/"
          class="auth-brand"
        >
          MEMORA
        </a>


        <div class="auth-visual-copy">

          <span class="auth-eyebrow">
            Customer Account
          </span>

          <h1>
            Create your account.
          </h1>

          <p>
            Buat akun untuk menyimpan alamat
            dan melakukan pemesanan melalui MEMORA.
          </p>

        </div>


        <div class="auth-paper">

          <span>
            MEMORA
          </span>

          <strong>
            Your story,
            printed personally.
          </strong>

        </div>

      </div>


      <div class="auth-content">

        <div class="auth-card">

          <a
            href="/"
            class="auth-back"
          >
            Back to Home
          </a>


          <span class="auth-eyebrow">
            Create Account
          </span>


          <h2>
            Register
          </h2>


          <p class="auth-intro">
            Lengkapi data berikut untuk membuat akun customer.
          </p>


          <form id="registerForm">


            <div class="auth-field">

              <label for="registerName">
                Nama Lengkap
              </label>

              <input
                type="text"
                id="registerName"
                autocomplete="name"
                required
                placeholder="Nama lengkap"
              >

            </div>


            <div class="auth-field">

              <label for="registerEmail">
                Email
              </label>

              <input
                type="email"
                id="registerEmail"
                autocomplete="email"
                required
                placeholder="nama@email.com"
              >

            </div>


            <div class="auth-field">

              <label for="registerWhatsapp">
                WhatsApp
              </label>

              <input
                type="tel"
                id="registerWhatsapp"
                autocomplete="tel"
                required
                placeholder="08xxxxxxxxxx"
              >

            </div>


            <div class="auth-field">

              <label for="registerPassword">
                Password
              </label>

              <div class="password-wrap">

                <input
                  type="password"
                  id="registerPassword"
                  autocomplete="new-password"
                  required
                  minlength="8"
                  placeholder="Minimal 8 karakter"
                >

                <button
                  type="button"
                  class="password-toggle"
                  data-password-toggle="registerPassword"
                >
                  Lihat
                </button>

              </div>

            </div>


            <div class="auth-field">

              <label for="registerPasswordConfirm">
                Konfirmasi Password
              </label>

              <div class="password-wrap">

                <input
                  type="password"
                  id="registerPasswordConfirm"
                  autocomplete="new-password"
                  required
                  minlength="8"
                  placeholder="Ulangi password"
                >

                <button
                  type="button"
                  class="password-toggle"
                  data-password-toggle="registerPasswordConfirm"
                >
                  Lihat
                </button>

              </div>

            </div>


            <div
              class="auth-message"
              id="registerMessage"
              hidden
            ></div>


            <button
              type="submit"
              class="auth-submit"
              id="registerButton"
            >
              Daftar
            </button>


          </form>


          <div class="auth-footer">

            <span>
              Sudah punya akun?
            </span>

            <a
              href="/account/login/"
              id="loginLink"
            >
              Login
            </a>

          </div>


        </div>

      </div>


    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="/js/supabase.js"></script>

  <script src="/js/auth.js"></script>


</body>

</html>
