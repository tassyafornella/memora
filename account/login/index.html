<!doctype html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Login - MEMORA
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/css/app.css"
  >

  <link
    rel="stylesheet"
    href="/css/auth.css"
  >

</head>


<body>


  <main class="auth-page">

    <section class="auth-layout">


      <div class="auth-visual">

        <a
          href="/"
          class="auth-brand"
        >
          MEMORA
        </a>


        <div class="auth-visual-copy">

          <span class="auth-eyebrow">
            Customer Account
          </span>

          <h1>
            Welcome back.
          </h1>

          <p>
            Login untuk melanjutkan checkout,
            melihat pesanan, dan mengelola alamat.
          </p>

        </div>


        <div class="auth-paper">

          <span>
            MEMORA
          </span>

          <strong>
            Made for
            meaningful moments.
          </strong>

        </div>

      </div>


      <div class="auth-content">

        <div class="auth-card">

          <a
            href="/"
            class="auth-back"
          >
            Back to Home
          </a>


          <span class="auth-eyebrow">
            Sign In
          </span>


          <h2>
            Login
          </h2>


          <p class="auth-intro">
            Masuk menggunakan akun customer MEMORA.
          </p>


          <form id="loginForm">


            <div class="auth-field">

              <label for="loginEmail">
                Email
              </label>

              <input
                type="email"
                id="loginEmail"
                autocomplete="email"
                required
                placeholder="nama@email.com"
              >

            </div>


            <div class="auth-field">

              <label for="loginPassword">
                Password
              </label>

              <div class="password-wrap">

                <input
                  type="password"
                  id="loginPassword"
                  autocomplete="current-password"
                  required
                  placeholder="Password"
                >

                <button
                  type="button"
                  class="password-toggle"
                  data-password-toggle="loginPassword"
                >
                  Lihat
                </button>

              </div>

            </div>


            <div
              class="auth-message"
              id="loginMessage"
              hidden
            ></div>


            <button
              type="submit"
              class="auth-submit"
              id="loginButton"
            >
              Login
            </button>


          </form>


          <div class="auth-footer">

            <span>
              Belum punya akun?
            </span>

            <a
              href="/account/register/"
              id="registerLink"
            >
              Daftar
            </a>

          </div>


        </div>

      </div>


    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="/js/supabase.js"></script>

  <script src="/js/auth.js"></script>


</body>

</html>
