<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Memora</title>

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <link
    rel="stylesheet"
    href="../../css/account.css"
  >

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/customer-nav.css">
  <link rel="stylesheet" href="/css/customer-final.css?v=20261002-185048">
</head>


<body class="account-body">


<main class="account-auth-page">


  <section class="account-auth-card">


    <a
      href="../../"
      class="account-brand"
    >
      MEMORA
    </a>


    <div class="account-auth-heading">

      <span>
        Customer Account
      </span>

      <h1>
        Login
      </h1>

      <p>
        Welcome back. Continue your journey with Memora.
      </p>

    </div>


    <form
      id="loginForm"
      class="account-form"
    >


      <div class="account-form-group">

        <label for="loginEmail">
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          autocomplete="email"
          required
          placeholder="nama@email.com"
        >

      </div>


      <div class="account-form-group">

        <div class="account-label-row">

          <label for="loginPassword">
            Password
          </label>

          <a
            href="../forgot-password/"
            class="account-forgot-link"
          >
            Lupa password?
          </a>

        </div>


        <div class="account-password-field">

          <input
            type="password"
            id="loginPassword"
            autocomplete="current-password"
            required
            placeholder="Password"
          >

          <button
            type="button"
            class="account-password-toggle"
            data-password-toggle="loginPassword"
          >
            Lihat
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="account-primary-button"
        id="loginButton"
      >
        Login
      </button>


      <div
        class="account-message"
        id="loginMessage"
        hidden
      ></div>


    </form>


    <div class="account-auth-footer">

      <span>
        Belum punya akun?
      </span>

      <a href="../register/">
        Daftar
      </a>

    </div>


  </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../../js/supabase.js"></script>
<script src="../../js/account.js"></script>


  <script src="/js/customer-nav.js"></script>
</body>

</html>
