<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pesanan Berhasil | Memora</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../../css/style.css"
  >

  <style>

    * {
      font-family:
        "Poppins",
        Arial,
        sans-serif;

      font-style:
        normal;
    }

    .success-shell {
      width:
        min(
          calc(100% - 32px),
          650px
        );

      margin:
        0 auto;

      padding:
        80px 0;
    }

    .success-card {
      padding:
        42px 28px;

      border:
        1px solid #dde6e0;

      border-radius:
        24px;

      background:
        #fff;

      text-align:
        center;
    }

    .success-check {
      width:
        60px;

      height:
        60px;

      display:
        grid;

      place-items:
        center;

      margin:
        0 auto 20px;

      border-radius:
        50%;

      background:
        #e8f0eb;

      color:
        #173f35;

      font-size:
        25px;
    }

    .success-card h1 {
      margin:
        0;

      color:
        #173f35;

      font-size:
        25px;

      font-weight:
        600;
    }

    .success-card p {
      margin:
        12px auto 0;

      max-width:
        500px;

      color:
        #6f7e77;

      font-size:
        12px;

      line-height:
        1.8;
    }

    .success-number {
      margin:
        24px 0;

      padding:
        16px;

      border-radius:
        14px;

      background:
        #f7f9f7;

      color:
        #173f35;

      font-size:
        16px;

      font-weight:
        600;
    }

    .success-actions {
      display:
        flex;

      justify-content:
        center;

      gap:
        9px;

      flex-wrap:
        wrap;

      margin-top:
        24px;
    }

    .success-button {
      min-height:
        44px;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        0 18px;

      border-radius:
        999px;

      text-decoration:
        none;

      font-size:
        11px;

      font-weight:
        600;
    }

    .success-button.primary {
      background:
        #173f35;

      color:
        #fff;
    }

    .success-button.secondary {
      border:
        1px solid #dde6e0;

      color:
        #173f35;
    }

  </style>

  <link rel="stylesheet" href="/css/customer-nav.css">
  <link rel="stylesheet" href="/css/customer-final.css?v=20261002-185048">
</head>


<body>


  <header class="site-header">

    <div class="header-inner">

      <a
        href="/"
        class="brand"
      >
        MEMORA
      </a>

      <nav
        class="customer-nav"
        id="customerNav"
      ></nav>

    </div>

  </header>


  <main class="success-shell">

    <section class="success-card">

      <div class="success-check">
        ✓
      </div>

      <h1>
        Pesanan berhasil dibuat
      </h1>

      <p>
        Terima kasih sudah mempercayakan kebutuhan
        stationery-mu kepada Memora.
        Tim Memora akan menghubungi kamu melalui WhatsApp
        untuk konfirmasi detail pesanan, desain,
        ongkir, dan pembayaran.
      </p>

      <div
        class="success-number"
        id="successOrderNumber"
      >
        Pesanan telah tersimpan
      </div>

      <div class="success-actions">

        <a
          href="/account/orders/"
          class="success-button primary"
        >
          Lihat Pesanan Saya
        </a>

        <a
          href="/#collection"
          class="success-button secondary"
        >
          Kembali ke Koleksi
        </a>

      </div>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="../../js/supabase.js"></script>
  <script src="../../js/customer-nav.js"></script>

  <script>

    (function () {

      const params =
        new URLSearchParams(
          location.search
        );


      const number =
        params.get(
          "number"
        );


      if (number) {

        document
          .getElementById(
            "successOrderNumber"
          )
          .textContent =
          number;

      }

    })();

  </script>


</body>
</html>
