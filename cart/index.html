<!doctype html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Cart Ã¢â‚¬â€ MEMORA
  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/css/app.css"
  >

  <link
    rel="stylesheet"
    href="/css/cart.css"
  >

</head>


<body>

  <main class="cart-page">


    <div class="cart-breadcrumb">

      <a href="/">
        Home
      </a>

      <span>/</span>

      <span>
        Cart
      </span>

    </div>


    <div class="cart-heading">

      <div>

        <span class="cart-eyebrow">
          Your Selection
        </span>

        <h1>
          Shopping Cart
        </h1>

      </div>


      <button
        type="button"
        class="clear-cart-button"
        id="clearCartButton"
      >
        Clear Cart
      </button>

    </div>


    <section
      class="cart-empty"
      id="cartEmpty"
      hidden
    >

      <div class="empty-icon">
        M
      </div>

      <h2>
        Keranjang masih kosong.
      </h2>

      <p>
        Pilih produk MEMORA dan tambahkan
        ke keranjang terlebih dahulu.
      </p>

      <a
        href="/#collection"
        class="cart-secondary-button"
      >
        Lihat Collection
      </a>

    </section>


    <section
      class="cart-layout"
      id="cartLayout"
      hidden
    >


      <div class="cart-list">

        <div
          id="cartItems"
          class="cart-items"
        ></div>

      </div>


      <aside class="cart-summary">

        <span class="summary-eyebrow">
          Order Summary
        </span>

        <h2>
          Ringkasan Pesanan
        </h2>


        <div class="summary-divider"></div>


        <div class="summary-line">

          <span>
            Total Item
          </span>

          <strong id="summaryItemCount">
            0
          </strong>

        </div>


        <div class="summary-line">

          <span>
            Total Quantity
          </span>

          <strong id="summaryQuantity">
            0 pcs
          </strong>

        </div>


        <div class="summary-divider"></div>


        <div class="summary-total">

          <span>
            Total
          </span>

          <strong id="summaryTotal">
            Rp0
          </strong>

        </div>


        <a
          href="/checkout/"
          class="checkout-button"
          id="checkoutButton"
        >
          Lanjut ke Checkout
        </a>


        <a
          href="/#collection"
          class="continue-shopping"
        >
          Ã¢â€ Â Continue Shopping
        </a>

      </aside>

    </section>


  </main>


  <div
    class="cart-toast"
    id="cartToast"
    hidden
  ></div>


  <script src="/js/app.js"></script>
  <script src="/js/cart.js"></script>

  <script src="/js/customer-flow.js"></script>
  <script src="/js/back-navigation.js"></script>
</body>

</html>
